<!DOCTYPE html>
<html>
<head>
    <title>Student Manager</title>
</head>
<body>
    <h1>Add Student</h1>
    <form method="POST" action="/add">
        <input type="text" name="name" placeholder="Student name" required>
        <button type="submit">Add</button>
    </form>
    <a href="/students">View Students</a>
</body>
</html>
