<!DOCTYPE html>
<html>
<head>
    <title>Students</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="max-w-2xl mx-auto mt-20 bg-white rounded-lg shadow-lg p-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Students</h1>
        <div class="space-y-2">
        {% for student in students %}
            <div class="bg-blue-50 p-4 rounded-lg border-l-4 border-blue-600">
                <p class="text-gray-800 font-semibold">{{ student[1] }}</p>
            </div>
        {% endfor %}
        </div>
        <a href="/" class="block mt-6 text-center bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition">
            ← Back
        </a>
    </div>
</body>
</html>
